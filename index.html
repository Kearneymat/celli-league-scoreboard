<head>

<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Celli League Scoreboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: stadium scoreboard header band, then a dense operable leaderboard with drill-down lineups */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --sunk:#e8ece6; --line:#d3d9d0;
  --ink:#16201b; --muted:#5d6a62; --accent:#1d6b45; --accent-ink:#ffffff;
  --gold:#a8730b; --gold-bg:#fbefd2; --up:#1d6b45; --down:#b3361f; --warn-bg:#fde7e2;
  --live:#c2410c;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#16201b; --sunk:#1c2822; --line:#2b3a32;
  --ink:#e6ede8; --muted:#97a69c; --accent:#4fbf86; --accent-ink:#0b1410;
  --gold:#e3b047; --gold-bg:#3a2e12; --up:#4fbf86; --down:#f08a72; --warn-bg:#3d1f18; --live:#fb923c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#16201b; --sunk:#1c2822; --line:#2b3a32;
  --ink:#e6ede8; --muted:#97a69c; --accent:#4fbf86; --accent-ink:#0b1410;
  --gold:#e3b047; --gold-bg:#3a2e12; --up:#4fbf86; --down:#f08a72; --warn-bg:#3d1f18; --live:#fb923c; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.board{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;border-bottom:3px solid var(--ink);padding-bottom:14px}
.eyebrow{font-family:var(--f-display);font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:13px;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,7vw,56px);line-height:.95;margin:4px 0 0;letter-spacing:-.01em;text-wrap:balance}
.status{display:flex;flex-direction:column;align-items:flex-end;gap:6px;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:13px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.final .dot{background:var(--ink)} .pill.live .dot{background:var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.3}} @media (prefers-reduced-motion:reduce){.pill.live .dot{animation:none}}
.updated{font-size:13px;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:18px 0 14px}
.summary>div{background:var(--surface);padding:10px 14px;min-width:0}
.summary .k{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.1em;font-size:12px;color:var(--muted);font-weight:700}
.summary .v{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.summary .s{font-size:13px;color:var(--muted)}
.games{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:14px;scrollbar-width:thin}
.game{flex:0 0 auto;font-family:var(--f-num);font-size:12px;border:1px solid var(--line);background:var(--surface);padding:4px 8px;border-radius:4px;color:var(--muted);white-space:nowrap}
.game b{color:var(--ink);font-weight:600}
.game.on{border-color:var(--live);color:var(--live)}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.tabs{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.tabs button{font:700 14px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:0;background:transparent;color:var(--muted);padding:8px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.tabs button:focus-visible,.row:focus-visible,input:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);width:200px;max-width:100%}
.toggle{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);cursor:pointer;border-radius:4px}
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 70px 82px 22px;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line);cursor:pointer;background:var(--surface)}
.row:hover{background:var(--sunk)}
.rank{font-family:var(--f-display);font-weight:800;font-size:22px;text-align:center;color:var(--muted)}
.row.top .rank{color:var(--gold)}
.row.top{background:var(--gold-bg)}
.owner{font-weight:700;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sd{display:inline-block;font:700 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:1px 6px;border-radius:3px;margin-left:6px;vertical-align:2px;background:var(--accent);color:var(--accent-ink)}
.sd.out{background:transparent;color:var(--muted);border:1px solid var(--line)}
.cut{padding:6px 10px;font:700 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--down);border-bottom:2px dashed var(--down);background:var(--warn-bg)}
.owner small{font-weight:600;color:var(--muted);font-size:12px;margin-left:6px}
.sub{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pts{font-family:var(--f-display);font-weight:800;font-size:26px;text-align:right}
.delta{font-size:12px;text-align:right}
.delta .flag{display:inline-block;background:var(--warn-bg);color:var(--down);border-radius:3px;padding:1px 5px;font-family:var(--f-num);font-weight:600}
.chev{color:var(--muted);transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(90deg)}
.detail{background:var(--sunk);border-bottom:1px solid var(--line);padding:6px 10px 12px 10px}
.lineup{width:100%;border-collapse:collapse;font-size:14px}
.tablewrap{overflow-x:auto}
.lineup th{font:700 11px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 6px;border-bottom:1px solid var(--line)}
.lineup td{padding:6px;border-bottom:1px dashed var(--line);vertical-align:top}
.lineup tr:last-child td{border-bottom:0}
.lineup .p{font:700 12px var(--f-display);letter-spacing:.06em;color:var(--muted);width:36px}
.lineup .n{font-weight:600;min-width:140px}
.lineup .t{font-size:12px;color:var(--muted);font-weight:400;display:block}
.lineup .bd{color:var(--muted);font-size:12.5px;min-width:180px}
.lineup .v{text-align:right;font-family:var(--f-num);font-weight:600;white-space:nowrap}
.lineup .v.neg{color:var(--down)}
.lineup .c{text-align:right;font-family:var(--f-num);font-size:12.5px;color:var(--muted);white-space:nowrap}
.lineup tr.diff td{background:var(--warn-bg)}
.lineup .c.bad{color:var(--down);font-weight:600}
.hide-audit .audit{display:none}
.note{font-size:13.5px;color:var(--muted);margin-top:18px;max-width:68ch}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:620px){
  .summary{grid-template-columns:repeat(2,minmax(0,1fr))}
  header.board{grid-template-columns:1fr}.status{align-items:flex-start;text-align:left}
  .row{grid-template-columns:34px minmax(0,1fr) 58px 18px}.row .delta{display:none}
  .pts{font-size:22px}
  .lineup .bd{min-width:150px}
}
</style>


</head>

$('#sHighName').textContent = byWeek.filter(t => t.total === hi.total).map(t => t.owner).join(' & ');
$('#sHigh').textContent = hi.total + ' pts';
$('#sAvg').textContent = (teams.reduce((s, t) => s + t.total, 0) / teams.length).toFixed(1);
const alive = teams.filter(t => t.alive);
$('#sSd').textContent = alive.length + ' left';
$('#sSds').textContent = 'of ' + teams.length + ' teams still alive';
$('#sLeadName').textContent = bySeason[0].owner;
$('#sLead').textContent = bySeason[0].season + ' pts overall';
const players = new Map();
teams.forEach(t => t.lineup.forEach(p => {
  const k = p.pos + '|' + p.name;
  if (!players.has(k)) players.set(k, {...p, owners: []});
  players.get(k).owners.push(t.owner);
}));
const plist = [...players.values()].sort((a, b) => b.pts - a.pts || b.owners.length - a.owners.length);
$('#sTopP').textContent = plist[0].name;
$('#sTopPs').textContent = plist[0].pts + ' pts · on ' + plist[0].owners.length + ' teams';
$('#games').innerHTML = DATA.games.map(g => typeof g === 'string' ? `<span class="game"><b>${esc(g)}</b> · Final</span>` : `<span class="game ${g.live ? 'on' : ''}"><b>${esc(g.t)}</b> · ${esc(g.s)}</span>`).join('');
$('#footnote').textContent = META.footnote;

function lineupTable(t) {
  const rows = t.lineup.map(p => {
    const c = (typeof p.comm === 'number') ? p.comm : null;
    const diff = META.audit && $('#audit').checked && c !== p.pts;
    const bd = p.bd.length ? p.bd.map(([l, v]) => `${esc(l)} <span class="num">(${v > 0 ? '+' : ''}${v})</span>`).join(' · ') : (p.yet ? 'Yet to play' : 'No scoring plays');
    return `<tr class="${diff ? 'diff' : ''}">
      <td class="p">${p.pos}</td>
      <td class="n">${esc(p.name)}<span class="t">${esc(p.game || p.team)}</span></td>
      <td class="bd">${bd}</td>
      <td class="v ${p.pts < 0 ? 'neg' : ''}">${p.pts}</td>
      <td class="c audit ${diff ? 'bad' : ''}">${c === null ? 'blank' : c}</td></tr>`;
  }).join('');
  return `<div class="tablewrap"><table class="lineup"><thead><tr><th>Pos</th><th>Player</th><th>How it scored</th><th style="text-align:right">Pts</th><th class="audit" style="text-align:right">Comm.</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function render() {
  const q = $('#q').value.trim().toLowerCase();
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', b.id === 'tab-' + tab));
  if (!META.audit) $('#audit').checked = false;
  $('#view').classList.toggle('hide-audit', !$('#audit').checked);
  $('#auditWrap').hidden = tab === 'players' || !META.audit;
  let html = '';
  if (tab === 'players') {
    const L = plist.filter(p => !q || p.name.toLowerCase().includes(q) || p.owners.some(o => o.toLowerCase().includes(q)));
    html = `<div class="tablewrap"><table class="lineup" style="background:var(--surface)"><thead><tr><th>Pos</th><th>Player</th><th>How it scored</th><th style="text-align:right">Pts</th><th style="text-align:right">Owned</th></tr></thead><tbody>` +
      L.map(p => `<tr><td class="p">${p.pos}</td><td class="n">${esc(p.name)}<span class="t">${esc(p.game || p.team)}</span></td><td class="bd">${p.bd.length ? p.bd.map(([l, v]) => esc(l) + ` <span class="num">(${v > 0 ? '+' : ''}${v})</span>`).join(' · ') : (p.yet ? 'Yet to play' : 'No scoring plays')}</td><td class="v ${p.pts < 0 ? 'neg' : ''}">${p.pts}</td><td class="c" title="${esc(p.owners.join(', '))}">${p.owners.length}</td></tr>`).join('') +
      `</tbody></table></div>`;
    if (!L.length) html = '<div class="empty">No players match that search.</div>';
  } else {
    const list = tab === 'season' ? bySeason : tab === 'showdown' ? byWeek.filter(t => t.alive) : byWeek;
    const L = list.filter(t => !q || t.owner.toLowerCase().includes(q) || t.lineup.some(p => p.name.toLowerCase().includes(q)));
    html = L.map((t, i) => {
      const rk = tab === 'season' ? seaRank.get(t.owner) : tab === 'showdown' ? list.indexOf(t) + 1 : wkRank.get(t.owner);
      const pts = tab === 'season' ? t.season : t.total;
      const d = t.total - t.comm;
      const sub = tab !== 'season'
        ? (t.lineup.filter(p => p.pts >= 30).map(p => p.name.split(' ').slice(-1)[0] + ' ' + p.pts).join(' · ') || 'No 30-point players') + (META.live ? ` · ${t.lineup.filter(p => p.yet || p.on).length} of ${t.lineup.length} still to play` : '')
        : `Week ${DATA.week}: ${t.total} · before: ${t.prev} · week rank ${wkRank.get(t.owner)}`;
      const delta = $('#audit').checked && d !== 0 ? `<span class="flag">${d > 0 ? '+' : ''}${d} vs comm.</span>` : '';
      const isOpen = open.has(t.owner);
      const cutHere = tab === 'showdown' && META.cutLive && !q && i === L.length - META.cut;
      return (cutHere ? `<div class="cut">Cut line · bottom ${META.cut} are eliminated</div>` : '') + `<div class="row ${rk === 1 ? 'top' : ''}" tabindex="0" role="button" aria-expanded="${isOpen}" data-o="${esc(t.owner)}">
        <div class="rank">${rk}</div>
        <div style="min-width:0"><div class="owner">${esc(t.owner)}${t.champ ? '<small>2025 champ</small>' : ''}${t.alive ? '<span class="sd">Showdown</span>' : ''}</div><div class="sub">${esc(sub)}</div></div>
        <div class="delta audit">${delta}</div>
        <div class="pts num">${pts}</div>
        <div class="chev" aria-hidden="true">›</div>
      </div>${isOpen ? `<div class="detail">${lineupTable(t)}</div>` : ''}`;
    }).join('') || '<div class="empty">No owners or players match that search.</div>';
    if (tab === 'showdown' && !q) html = `<div class="cut" style="color:var(--muted);border-bottom-style:solid;border-color:var(--line);background:var(--surface)">${list.length} teams still alive · ${META.cutNote}</div>` + html;
  }
  $('#view').innerHTML = html;
}
$('#view').addEventListener('click', e => { const r = e.target.closest('.row'); if (!r) return; const o = r.dataset.o; open.has(o) ? open.delete(o) : open.add(o); render(); });
$('#view').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('row')) { e.preventDefault(); e.target.click(); } });
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => { tab = b.id.slice(4); try { localStorage.setItem('tab', tab); } catch (e) {} render(); }));
$('#q').addEventListener('input', render);
$('#audit').addEventListener('change', render);
render();
</script>

<script>setTimeout(function(){location.replace(location.pathname+'?t='+Date.now())},180000);</script>
</body>
</html>
